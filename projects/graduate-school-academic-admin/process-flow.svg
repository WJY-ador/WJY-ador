<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1240 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wm-process-flow-title wm-process-flow-desc">
      <title id="wm-process-flow-title">온라인 대학원 입학·학사 프로세스 흐름</title>
      <desc id="wm-process-flow-desc">지원자가 원서를 내면 Salesforce가 Opportunity 단계로 추적하고 추천서 요청을 자동 발송하며, 행정·심사가 합불을 판정하면 불합격은 자동 통보, 합격자는 등록 후 재학생으로 자동 전환되고, 성적·수강은 정본인 외부 학사 시스템에서 기록되어 CRM이 수신만 하는 흐름.</desc>
