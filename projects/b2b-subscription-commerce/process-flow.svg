<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1336 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="b2b-process-flow-title b2b-process-flow-desc">
      <title id="b2b-process-flow-title">B2B 구독 커머스 영업·계약·상담 프로세스 흐름</title>
      <desc id="b2b-process-flow-desc">영업이 영업기회와 견적을 진행하고, 전자서명이 끝나면 Salesforce 계약 상태가 바뀌며, 서비스·매출은 정본인 고객사 ERP에서 CRM이 받아 오기만 하고, 서비스 이용 중 고객 문의는 AI Service Agent가 먼저 응대한 뒤 상담원에게 이관·검수로 넘어가며 상담원은 AI 분류 추천을 골라 확정하고 필요하면 Slack Swarming으로 영업과 함께 처리하는 흐름.</desc>
