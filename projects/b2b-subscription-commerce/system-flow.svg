      <line x1="316" y1="512" x2="316" y2="472" stroke="#6B7075" stroke-width="1.2" marker-end="url(#sf-arrow)"/>
      <rect x="324" y="484" width="68" height="16" rx="2" fill="#FAFAF7"/>
      <text x="328" y="496" fill="#6B7075" font-size="12" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">상담원 이관</text>

      <!-- AI Service Agent → Case 검수 (AI 단독 종결) -->
      <line x1="440" y1="540" x2="472" y2="540" stroke="#6B7075" stroke-width="1.2" marker-end="url(#sf-arrow)"/>

      <!-- Case → Slack Swarming -->
      <path d="M 412,472 V 488 Q 412,496 420,496 H 1104 Q 1112,496 1112,488 V 472" fill="none" stroke="#3D5A66" stroke-width="1.2" marker-end="url(#sf-arrow-link)"/>

