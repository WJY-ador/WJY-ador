      <!-- 전자서명 서비스 (external) -->
      <rect x="56" y="72" width="152" height="56" rx="6" fill="#FAFAF7"/>
      <rect x="56" y="72" width="152" height="56" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="132" y="98" fill="#1C1E21" font-size="16" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">전자서명 서비스</text>
      <text x="132" y="116" fill="#6B7075" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">외부 전자계약</text>

      <!-- 고객사 ERP (external, 정본) -->
      <rect x="56" y="268" width="152" height="64" rx="6" fill="#FAFAF7"/>
      <rect x="56" y="268" width="152" height="64" rx="6" fill="rgba(28,30,33,0.03)" stroke="#1C1E21" stroke-width="1.2"/>
      <text x="132" y="296" fill="#1C1E21" font-size="16" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">고객사 ERP</text>
      <text x="132" y="316" fill="#6B7075" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">매출 정본</text>

