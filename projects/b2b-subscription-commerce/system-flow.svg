      <text x="548" y="192" fill="#6B7075" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">자동화는 설계 단계</text>

      <!-- 계약 (허브) -->
      <rect x="656" y="144" width="152" height="64" rx="6" fill="#FAFAF7"/>
