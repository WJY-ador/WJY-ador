      <rect x="288" y="144" width="152" height="64" rx="6" fill="#FAFAF7"/>
      <rect x="288" y="144" width="152" height="64" rx="6" fill="#ffffff" stroke="#1C1E21" stroke-width="1"/>
      <text x="364" y="172" fill="#1C1E21" font-size="16" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">Opportunity</text>
      <text x="364" y="192" fill="#6B7075" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">유닛별 Sales Process</text>

