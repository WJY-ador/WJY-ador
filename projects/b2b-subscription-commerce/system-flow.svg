      <path d="M 176,472 V 532 Q 176,540 184,540 H 288" fill="none" stroke="#3D5A66" stroke-width="1.2" marker-end="url(#sf-arrow-link)"/>
      <rect x="136" y="492" width="32" height="16" rx="2" fill="#FAFAF7"/>
      <text x="152" y="504" fill="#3D5A66" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">웹챗</text>

