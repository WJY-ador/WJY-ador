<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1240 652" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-flow-title system-flow-desc">
      <title id="system-flow-title">B2B 구독 커머스 CRM 시스템 흐름</title>
      <desc id="system-flow-desc">고객사 ERP를 매출 정본으로 두고 Salesforce를 작업 레이어로 둔 구조로, 영업은 Opportunity에서 견적을 거쳐 계약 허브와 계약 라인·Asset을 거쳐 청구·매출 롤업으로, 상담은 채널에서 Case와 AI 분류 추천으로 이어지며 웹챗은 AI Service Agent가 Knowledge로 1차 응대한 뒤 상담원 이관 시 Case로, AI 단독 종결 시 Case 검수로 가고, Case와 Opportunity 모두 Slack Swarming으로 관련자를 모으며 전자서명 서비스가 계약 상태를 바꾼다.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');</style>
        <marker id="sf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6B7075"/></marker>
        <marker id="sf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C63D2F"/></marker>
        <marker id="sf-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3D5A66"/></marker>
      </defs>

      <!-- background: paper (GitHub dark mode에서도 종이색 유지) -->
      <rect width="100%" height="100%" fill="#FAFAF7"/>

      <!-- ── zones ── -->
      <rect x="40" y="40" width="184" height="544" rx="8" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.12)" stroke-width="0.8"/>
      <rect x="52" y="44" width="72" height="16" rx="2" fill="#FAFAF7"/>
      <text x="56" y="56" fill="#8E9398" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">외부 시스템</text>

      <rect x="272" y="40" width="736" height="544" rx="8" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.12)" stroke-width="0.8"/>
      <rect x="284" y="44" width="184" height="16" rx="2" fill="#FAFAF7"/>
      <text x="288" y="56" fill="#8E9398" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">SALESFORCE · 작업 레이어</text>

      <rect x="1024" y="40" width="176" height="544" rx="8" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.12)" stroke-width="0.8"/>
      <rect x="1036" y="44" width="36" height="16" rx="2" fill="#FAFAF7"/>
      <text x="1040" y="56" fill="#8E9398" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">협업</text>

      <!-- cloud eyebrows -->
      <text x="288" y="124" fill="#8E9398" font-size="12" font-weight="500" letter-spacing="0.14em" font-family="'IBM Plex Mono', ui-monospace, monospace">SALES CLOUD</text>
      <text x="288" y="396" fill="#8E9398" font-size="12" font-weight="500" letter-spacing="0.14em" font-family="'IBM Plex Mono', ui-monospace, monospace">SERVICE CLOUD</text>

      <!-- ── 정본 경계 (판단 지점) ── -->
      <line x1="248" y1="40" x2="248" y2="584" stroke="#C63D2F" stroke-width="1.2" stroke-dasharray="4,4"/>
      <rect x="212" y="188" width="72" height="20" rx="2" fill="#FAFAF7"/>
      <text x="248" y="203" fill="#C63D2F" font-size="12" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">정본 경계</text>

      <!-- ── arrows (drawn before nodes) ── -->
      <!-- 전자서명 → 계약 -->
      <path d="M 208,100 H 724 Q 732,100 732,108 V 144" fill="none" stroke="#3D5A66" stroke-width="1.2" marker-end="url(#sf-arrow-link)"/>
      <rect x="324" y="72" width="136" height="20" rx="2" fill="#FAFAF7"/>
      <text x="392" y="86" fill="#3D5A66" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">서명 완료 시 상태 전환</text>

      <!-- Opportunity → 견적 → 계약 → 계약 라인·Asset -->
      <line x1="440" y1="176" x2="472" y2="176" stroke="#6B7075" stroke-width="1.2" marker-end="url(#sf-arrow)"/>
      <line x1="624" y1="176" x2="656" y2="176" stroke="#6B7075" stroke-width="1.2" marker-end="url(#sf-arrow)"/>
      <line x1="808" y1="176" x2="840" y2="176" stroke="#6B7075" stroke-width="1.2" marker-end="url(#sf-arrow)"/>

      <!-- 계약 라인·Asset → 청구·매출 롤업 -->
      <line x1="916" y1="208" x2="916" y2="272" stroke="#6B7075" stroke-width="1.2" marker-end="url(#sf-arrow)"/>

      <!-- ERP → 청구·매출 롤업 (정본에서 흘러오는 매출) -->
      <line x1="208" y1="300" x2="840" y2="300" stroke="#C63D2F" stroke-width="1.2" marker-end="url(#sf-arrow-accent)"/>
      <rect x="336" y="272" width="112" height="20" rx="2" fill="#FAFAF7"/>
      <text x="392" y="286" fill="#C63D2F" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">매출 데이터 유입</text>

      <!-- 상담 채널 → Case → AI 분류 추천 -->
      <line x1="208" y1="444" x2="288" y2="444" stroke="#3D5A66" stroke-width="1.2" marker-end="url(#sf-arrow-link)"/>
      <line x1="440" y1="444" x2="472" y2="444" stroke="#6B7075" stroke-width="1.2" marker-end="url(#sf-arrow)"/>

