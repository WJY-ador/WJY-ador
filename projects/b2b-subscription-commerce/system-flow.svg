      <path d="M 364,208 V 232 Q 364,240 372,240 H 908 a 8,8 0 0,1 16,0 H 1104 Q 1112,240 1112,248 V 416" fill="none" stroke="#3D5A66" stroke-width="1.2" marker-end="url(#sf-arrow-link)"/>

