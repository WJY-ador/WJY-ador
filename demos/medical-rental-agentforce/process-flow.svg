      <rect x="340" y="288" width="136" height="56" rx="6" fill="#ffffff" stroke="#1C1E21" stroke-width="1"/>
      <text x="408" y="314" fill="#1C1E21" font-size="16" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">Knowledge 답변</text>
      <text x="408" y="334" fill="#6B7075" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">인증 없이 바로</text>
      <circle cx="340" cy="288" r="10" fill="#1C1E21"/><text x="340" y="292" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">3</text>

      <rect x="512" y="64" width="136" height="56" rx="6" fill="#FAFAF7"/>
      <rect x="512" y="64" width="136" height="56" rx="6" fill="#ffffff" stroke="#1C1E21" stroke-width="1"/>
      <text x="580" y="90" fill="#1C1E21" font-size="16" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">이름 · 생년월일</text>
      <text x="580" y="110" fill="#6B7075" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">고객이 입력</text>
      <circle cx="512" cy="64" r="10" fill="#1C1E21"/><text x="512" y="68" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">3</text>

      <rect x="684" y="168" width="136" height="56" rx="6" fill="#FAFAF7"/>
      <rect x="684" y="168" width="136" height="56" rx="6" fill="#ffffff" stroke="#1C1E21" stroke-width="1"/>
      <text x="752" y="194" fill="#1C1E21" font-size="16" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">인증번호 확인</text>
      <text x="752" y="214" fill="#6B7075" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">등록된 연락처로 발송</text>
      <circle cx="684" cy="168" r="10" fill="#1C1E21"/><text x="684" y="172" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">4</text>

      <rect x="856" y="168" width="136" height="56" rx="6" fill="#FAFAF7"/>
      <rect x="856" y="168" width="136" height="56" rx="6" fill="#ffffff" stroke="#1C1E21" stroke-width="1"/>
      <text x="924" y="194" fill="#1C1E21" font-size="16" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">계약 · 기기 · 사용</text>
      <text x="924" y="214" fill="#6B7075" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">본인 확인 후 답변</text>
      <circle cx="856" cy="168" r="10" fill="#1C1E21"/><text x="856" y="172" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">5</text>

