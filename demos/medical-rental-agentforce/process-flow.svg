      <path d="M 408,244 V 288" fill="none" stroke="#6B7075" stroke-width="1.2" marker-end="url(#sf-arrow)"/>

      <rect x="416" y="256" width="64" height="16" rx="2" fill="#FAFAF7"/><text x="420" y="268" fill="#6B7075" font-size="12" text-anchor="start" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">일반 질문</text>

      <path d="M 496,196 H 564 Q 572,196 572,188 V 120" fill="none" stroke="#6B7075" stroke-width="1.2" marker-end="url(#sf-arrow)"/>

