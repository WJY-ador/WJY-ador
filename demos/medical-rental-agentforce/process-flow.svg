      <line x1="40" y1="144" x2="1016" y2="144" stroke="rgba(28,30,33,0.12)" stroke-width="1"/>
      <line x1="40" y1="360" x2="1016" y2="360" stroke="rgba(28,30,33,0.12)" stroke-width="1"/>
      <line x1="40" y1="464" x2="1016" y2="464" stroke="rgba(28,30,33,0.22)" stroke-width="1"/>
      <line x1="136" y1="40" x2="136" y2="464" stroke="rgba(28,30,33,0.22)" stroke-width="1"/>
      <text x="52" y="96" fill="#6B7075" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">고객</text>
      <text x="52" y="248" fill="#6B7075" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">AI Service</text>
      <text x="52" y="264" fill="#6B7075" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">Agent</text>
      <text x="52" y="416" fill="#6B7075" font-size="12" font-weight="500" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">상담원</text>

