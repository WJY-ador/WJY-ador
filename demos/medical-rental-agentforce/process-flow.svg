      <text x="924" y="410" fill="#1C1E21" font-size="16" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">상담원 연결</text>
      <text x="924" y="430" fill="#6B7075" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">Case 생성 후 이관</text>
      <circle cx="856" cy="384" r="10" fill="#1C1E21"/><text x="856" y="388" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">6</text>

      <line x1="40" y1="484" x2="1016" y2="484" stroke="rgba(28,30,33,0.12)" stroke-width="0.8"/>
