      <line x1="440" y1="506" x2="468" y2="506" stroke="#6B7075" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#sf-arrow)"/>
      <text x="480" y="510" fill="#6B7075" font-size="12" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">AI Service Agent가 해결하지 못한 문의만</text>
