      <text x="236" y="90" fill="#1C1E21" font-size="16" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">고객 문의</text>
      <text x="236" y="110" fill="#6B7075" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">웹 채팅</text>
      <circle cx="168" cy="64" r="10" fill="#1C1E21"/><text x="168" y="68" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">1</text>

      <polygon points="408,148 496,196 408,244 320,196" fill="#FAFAF7"/>
      <polygon points="408,148 496,196 408,244 320,196" fill="rgba(198,61,47,0.07)" stroke="#C63D2F" stroke-width="1.2"/>
      <text x="408" y="198" fill="#1C1E21" font-size="16" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">개인 정보 필요?</text>
      <text x="408" y="218" fill="#6B7075" font-size="12" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">질문 판별</text>
      <circle cx="348" cy="164" r="10" fill="#1C1E21"/><text x="348" y="168" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">2</text>

