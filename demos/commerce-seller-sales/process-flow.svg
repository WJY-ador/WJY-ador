<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 808" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="commerce-process-flow-title commerce-process-flow-desc">
      <title id="commerce-process-flow-title">커머스 플랫폼 셀러 영업 데모 프로세스 흐름</title>
      <desc id="commerce-process-flow-desc">영업 리더가 대시보드에 질문해 현황을 보고, 영업 기획이 프로모션 대상 셀러의 영업기회를 일괄 생성하면, 영업 담당이 파이프라인과 셀러 360을 보고, 영업 기획이 AI에 질문해 Slack 대화와 CRM 레코드를 함께 인용받고, 마케팅이 세그먼트로 셀러에게 자동 연락하며, 영업 담당이 파생 영업기회를 잡고, 영업 리더가 성과를 drill-down으로 확인하는 여덟 장면의 흐름.</desc>
