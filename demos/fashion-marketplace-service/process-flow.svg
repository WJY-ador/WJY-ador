      <desc id="process-flow-fashion-desc">한 구매 고객의 문의가 네 장면을 거치며 결정 주체가 상담사 혼자, 전문가 소집, 셀러와 MD, AI Service Agent 단독으로 넓어지고, 마지막 장면에서 AI Service Agent가 Knowledge에 정책 근거가 있으면 쿠폰 발행까지 끝내고 없으면 상담사에게 이관하는 흐름.</desc>
